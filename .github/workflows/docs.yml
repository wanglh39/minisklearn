name: 部署文档到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -e ".[docs]"

      - name: 构建文档
        run: mkdocs build

      - name: 部署到 GitHub Pages
        run: mkdocs gh-deploy --force